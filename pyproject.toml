[project]
name = "harness-lab"
version = "0.1.0"
description = "A configurable coding-agent harness for measuring how architecture decisions change task success and inference workload."
readme = "README.md"
authors = [
    { name = "zoyaarief", email = "arief.z@northeastern.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "harbor>=0.23.0,<0.24",  # Harbor's agent API changes quickly; bump deliberately
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
